<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collaborative Drawing Game</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: 'Minecraft', monospace, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: linear-gradient(135deg, #ff6b35 0%, #f7931e 50%, #ffdd44 100%);
        min-height: 100vh;
        overflow: hidden;
      }
      
      #root {
        min-height: 100vh;
      }
      
      .initial-loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, #ff6b35 0%, #f7931e 50%, #ffdd44 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      .initial-loading-content {
        text-align: center;
        color: #2a1810;
        background: rgba(42, 24, 16, 0.1);
        padding: 2rem;
        border-radius: 12px;
        border: 3px solid #2a1810;
        box-shadow: 0 0 30px rgba(255, 221, 68, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
      }

      .initial-loading-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 1rem;
        background: #2a1810;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulse 2s infinite;
        box-shadow: 0 0 20px rgba(255, 221, 68, 0.8);
      }

      .initial-loading-icon::before {
        content: '🎨';
        font-size: 32px;
        animation: bounce 1.5s ease-in-out infinite;
      }

      .initial-loading-title {
        font-size: 1.25rem;
        font-weight: bold;
        margin-bottom: 0.5rem;
        text-shadow: 0 0 15px rgba(255, 221, 68, 0.8), 2px 2px 4px rgba(0, 0, 0, 0.8);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .initial-loading-message {
        font-size: 0.875rem;
        margin-bottom: 1.5rem;
        opacity: 0.9;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
      }

      .initial-loading-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #ffdd44;
        border-top: 3px solid transparent;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto;
        box-shadow: 0 0 10px rgba(255, 221, 68, 0.5);
      }

      .initial-loading-dots {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        margin-top: 1rem;
      }

      .initial-dot {
        width: 8px;
        height: 8px;
        background: #ffdd44;
        border-radius: 50%;
        animation: bounce-dots 1.4s ease-in-out infinite both;
        box-shadow: 0 0 5px rgba(255, 221, 68, 0.7);
      }

      .initial-dot:nth-child(1) { animation-delay: -0.32s; }
      .initial-dot:nth-child(2) { animation-delay: -0.16s; }
      .initial-dot:nth-child(3) { animation-delay: 0s; }

      @keyframes pulse {
        0%, 100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.7;
          transform: scale(1.05);
        }
      }

      @keyframes bounce {
        0%, 20%, 50%, 80%, 100% {
          transform: translateY(0);
        }
        40% {
          transform: translateY(-10px);
        }
        60% {
          transform: translateY(-5px);
        }
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes bounce-dots {
        0%, 80%, 100% {
          transform: scale(0);
          opacity: 0.5;
        }
        40% {
          transform: scale(1);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loading">
        <div class="initial-loading-content">
          <div class="initial-loading-icon"></div>
          <h2 class="initial-loading-title">Collaborative Drawing Game</h2>
          <p class="initial-loading-message">Loading retro experience...</p>
          <div class="initial-loading-spinner"></div>
          <div class="initial-loading-dots">
            <span class="initial-dot"></span>
            <span class="initial-dot"></span>
            <span class="initial-dot"></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
